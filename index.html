 gr.addEventListener('pointermove',e=>{if(!swipePattern.active)return;const cell=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('#gr .c');if(!cell)return;const step=Number(cell.dataset.s);if(step%2===0&&step!==swipePattern.last){cell.classList.add('pattern-swipe-active');noteCommand('creator.pattern.step.toggle',{step});swipePattern.last=step}});
 ['pointerup','pointercancel','lostpointercapture'].forEach(t=>gr.addEventListener(t,()=>{swipePattern.active=false;gr.querySelectorAll('.pattern-swipe-active').forEach(el=>el.classList.remove('pattern-swipe-active'))}));
 nudgeButton.addEventListener('click',()=>{freeMove=!freeMove;nudgeButton.classList.toggle('selected',freeMove);nudgeButton.textContent=freeMove?'✥':'↕';pianoGrid.classList.toggle('free-drag',freeMove)});
 let rotorAngle=null,rotorRemainder=0,rotorTarget="pitch";
 window.__zpEncoderTargets={...(window.__zpEncoderTargets||{}),lx:"step",rx:"pitch"};
 const midiRotor=document.querySelector('.pe');
 window.addEventListener("zp-panel-option-select",event=>{
  const d=event.detail||{};if(d.context!=="piano")return;
  const side=d.side==="L"?"lx":"rx",option=String(d.option||"").trim().toUpperCase();
  const maps={
   lx:{NOTE:"step",QUANTIZE:"step"},
   rx:{PITCH:"pitch",VELOCITY:"velocity","NOTE DYNAMICS":"velocity",ACCENT:"velocity",LENGTH:"length",GATE:"length",QUANTIZE:"step",STEP:"step"}
  };
  const target=maps[side][option],encoder=side==="lx"?leftEncoder:rightEncoder;
  if(!target){encoder.dataset.panelOption=option;encoder.title=side.toUpperCase()+" · "+option+" · SIN ACCIÓN ASIGNADA";return;}
  window.__zpEncoderTargets[side]=target;
  if(side==="rx")rotorTarget=target;
  encoder.dataset.editTarget="MIDI "+target.toUpperCase();
  encoder.setAttribute("aria-label",side.toUpperCase()+" · MIDI "+target.toUpperCase());
  encoder.title="Piano Roll · "+target.toUpperCase()+" · SHIFT para ajuste fino";
  if(!noteTools.hidden)noteTools.querySelectorAll("[data-midi-target]").forEach(button=>button.classList.toggle("selected",button.dataset.midiTarget===rotorTarget));
 });
 nudgeButton.addEventListener('click',()=>{window.__zpMidiRotorActive=freeMove;rotorAngle=null;rotorRemainder=0});
 midiRotor?.addEventListener('pointerdown',()=>{if(freeMove){rotorAngle=parseFloat(getComputedStyle(midiRotor).getPropertyValue('--r'))||0;rotorRemainder=0}});
 midiRotor?.addEventListener('pointermove',()=>{if(window.__zpPianoEncoderMode||!freeMove)return;const angle=parseFloat(getComputedStyle(midiRotor).getPropertyValue('--r'))||0;if(rotorAngle===null){rotorAngle=angle;return}rotorRemainder+=angle-rotorAngle;rotorAngle=angle;const delta=Math.trunc(rotorRemainder/12);if(!delta)return;rotorRemainder-=delta*12;const n=selectedNote();if(n){if(rotorTarget==="pitch")upsertNote({...n,pitch:clamp(n.pitch+delta,36,96)});else if(rotorTarget==="step")upsertNote({...n,step:clamp(n.step+delta,0,15)});else if(rotorTarget==="length")upsertNote({...n,length:clamp(n.length+delta,1,16-n.step)});else upsertNote({...n,velocity:clamp(n.velocity+delta,1,127)});if(!noteTools.hidden)$('#zpNoteInfo').textContent='STEP '+(selectedNote().step+1)+' · '+noteName(selectedNote().pitch)+' · LEN '+selectedNote().length+' · VEL '+selectedNote().velocity}else{octaveShift=clamp(octaveShift+delta/12,-8,8);buildPiano()}});
 midiRotor?.addEventListener('pointerup',()=>{rotorAngle=null});midiRotor?.addEventListener('pointercancel',()=>{rotorAngle=null});
 pianoGrid.addEventListener('pointerdown',e=>{const el=e.target.closest('.piano-note');if(!el)return;longPressFired=false;clearTimeout(longPressTimer);longPressTimer=setTimeout(()=>{longPressFired=true;const n=activeNotes.find(x=>x.id===el.dataset.id);if(n){selectedNoteId=n.id;showNoteTools();renderNotes()}},2000)});
 ['pointerup','pointercancel','pointerleave'].forEach(t=>pianoGrid.addEventListener(t,()=>clearTimeout(longPressTimer)));
 
 let noteDrag=null;
 pianoGrid.addEventListener('pointerdown',e=>{const el=e.target.closest('.piano-note');if(!el)return;const note=activeNotes.find(n=>n.id===el.dataset.id);if(!note)return;e.preventDefault();selectedNoteId=note.id;pianoGrid.querySelectorAll('.piano-note').forEach(item=>item.classList.toggle('selected',item.dataset.id===selectedNoteId));velocityInput.value=String(note.velocity);const rect=el.getBoundingClientRect(),cellRect=pianoGrid.querySelector('.piano-cell')?.getBoundingClientRect();noteDrag={id:note.id,startX:e.clientX,startY:e.clientY,startStep:note.step,startMicro:Number(note.micro)||0,startPitch:note.pitch,startLength:note.length,cellWidth:cellRect?.width||18,rowHeight:12,resize:e.clientX>rect.right-9,moved:false,el};el.setPointerCapture(e.pointerId)});
 pianoGrid.addEventListener('pointermove',e=>{if(!noteDrag)return;const rawDx=(e.clientX-noteDrag.startX)/noteDrag.cellWidth,unsnapped=!!(e.shiftKey||freeMove),dx=unsnapped?rawDx:Math.round(Math.round(rawDx)/snapSize)*snapSize,dy=Math.round((e.clientY-noteDrag.startY)/noteDrag.rowHeight),n=activeNotes.find(x=>x.id===noteDrag.id);if(!n)return;noteDrag.moved=noteDrag.moved||Math.abs(dx)+Math.abs(dy)>0;if(noteDrag.resize){n.length=clamp(noteDrag.startLength+Math.round(dx),1,16-noteDrag.startStep)}else{const position=clamp(noteDrag.startStep+(noteDrag.startMicro||0)+dx,0,15.999),whole=Math.floor(position);n.step=clamp(whole,0,15);n.micro=unsnapped?clamp(position-whole,0,.999):0;n.pitch=clamp(noteDrag.startPitch-dy,36,96)}noteDrag.el.style.gridColumn=(n.step+2)+' / span '+n.length;noteDrag.el.style.transform=n.micro?'translateX('+(n.micro*100)+'%)':'none';const row=topMidi-n.pitch;if(row>=0&&row<24)noteDrag.el.style.gridRow=String(row+2)});
 const finishDrag=()=>{if(!noteDrag)return;const n=activeNotes.find(x=>x.id===noteDrag.id);if(n&&noteDrag.moved)upsertNote({...n});else renderNotes();noteDrag=null};
 pianoGrid.addEventListener('pointerup',finishDrag);pianoGrid.addEventListener('pointercancel',finishDrag);
 const patternButton=[...document.querySelectorAll('#rows .b')].find(b=>b.textContent.replace(/\s/g,'').toUpperCase()==='PATTERNEDIT');patternButton?.addEventListener('click',()=>setTimeout(()=>setPianoMode(scr.classList.contains('pr')),0));

 let bpmValue=120,lastY=null,remainder=0;
 const adjustTempo=delta=>{bpmValue=Math.max(40,Math.min(240,bpmValue+delta));bpm.textContent='BPM:'+bpmValue;window.zpBridgeSend?.('creator.bpm.adjust',{delta})};
 bpm.addEventListener('pointerdown',e=>{lastY=e.clientY;remainder=0;bpm.setPointerCapture(e.pointerId)});
 bpm.addEventListener('pointermove',e=>{if(lastY===null)return;remainder+=lastY-e.clientY;lastY=e.clientY;const delta=Math.trunc(remainder/5);if(delta){remainder-=delta*5;adjustTempo(delta)}});
 ['pointerup','pointercancel','lostpointercapture'].forEach(t=>bpm.addEventListener(t,()=>lastY=null));
 bpm.addEventListener('wheel',e=>{e.preventDefault();adjustTempo(e.deltaY<0?1:-1)},{passive:false});
 browse.addEventListener('click',()=>window.zpBridgeSend?.('creator.sample.load.request',{}));$('#transientChop').addEventListener('click',()=>window.zpBridgeSend?.('creator.sample.transient.chop',{}));
 const audition=mk('span','lcd-action','▶');audition.title='Escuchar muestra del pad';browse.parentNode.insertBefore(audition,browse);audition.addEventListener('click',()=>window.zpBridgeSend?.('creator.sample.preview',{}));
 
 window.addEventListener('message',e=>{
  if(e.source!==document.getElementById('zp-engine')?.contentWindow||e.origin!==location.origin||!e.data)return;const d=e.data;if(d.source!=='creator.engine')return;
  if(d.type==='zp-engine-playhead'&&d.protocolVersion===1&&d.source==='creator.engine'){fill.style.width=((d.step+1)/16*100)+'%';window.__zpPlayheadState={step:d.step,at:performance.now(),bpm:bpmValue||120}}if(d.type==='zp-engine-piano-state'&&d.protocolVersion===1&&d.source==='creator.engine'){activeNotes=Array.isArray(d.notes)?d.notes.map(n=>({...n})):[];selectedNoteId=activeNotes.some(n=>n.id===selectedNoteId)?selectedNoteId:null;renderNotes();paintPadMidi()}if(d.type==='zp-engine-playhead'&&d.protocolVersion===1&&d.source==='creator.engine'){const play=$('#zpPianoPlayhead');if(play)play.style.gridColumn=String(d.step+2)}
  if(d.type==='zp-engine-bpm-state'&&d.protocolVersion===1&&d.source==='creator.engine'){bpmValue=d.bpm;bpm.textContent='BPM:'+bpmValue}
  if(d.type==='zp-engine-meter'&&d.protocolVersion===1&&d.source==='creator.engine'){line.classList.toggle('peak',d.peak>.82)}
  if(d.type==='zp-engine-trim-state'&&d.protocolVersion===1&&d.source==='creator.engine'){const c=$('#wv');if(c&&d.transients){const x=c.getContext('2d'),w=c.width,h=c.height;x.save();x.strokeStyle='#ffb34b';x.lineWidth=1.5;d.transients.forEach(p=>{const px=p*w;x.beginPath();x.moveTo(px,2);x.lineTo(px,h-2);x.stroke()});x.restore()}}
 });
})();
