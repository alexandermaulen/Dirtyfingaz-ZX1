function drawValueWheel(el,label,initial,onValue,extraClass=""){let wrap=$("div","sp-dial value-encoder-wrap"),k=$("div","kb value-wheel"+(extraClass?" "+extraClass:""),"<i></i><b></b>"),caption=$("span","",label),out=$("output","",Math.round(initial*100)+"%"),v=initial,lastAngle=null;const set=x=>{v=Math.max(0,Math.min(1,x));k.firstChild.style.transform="rotate("+(-135+270*v)+"deg)";out.textContent=Math.round(v*100)+"%";onValue(v)};const angle=e=>{let r=k.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);return Math.atan2(dy,dx)*180/Math.PI};k.addEventListener("pointerdown",e=>{e.preventDefault();k.setPointerCapture(e.pointerId);lastAngle=angle(e)});k.addEventListener("pointermove",e=>{if(lastAngle===null)return;let a=angle(e),d=a-lastAngle;if(d>180)d-=360;if(d< -180)d+=360;lastAngle=a;set(v+d/270)});["pointerup","pointercancel","lostpointercapture"].forEach(ev=>k.addEventListener(ev,()=>lastAngle=null));wrap.append(caption,k,out);return {wrap,set,get:()=>v,output:out};}
function setKnobValues(){if(knobSetters.length){knobSetters[0].set(masterLevel);knobSetters[1].set(padLevels[activePad]??.85);knobSetters[2].set(((padPitch[activePad]??0)/24)+.5);knobSetters[3].set(((padFilter[activePad]??18000)-300)/17700)}}
function draw(){let w=Math.max(1,Math.floor(canvas.clientWidth*2)),h=Math.max(1,Math.floor(canvas.clientHeight*2));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}let x=canvas.getContext("2d");x.clearRect(0,0,w,h);let sample=activeTab==="RECORTE"?samples[sampleSlot(activePad)]:null;if(sample){let r=ranges[sampleSlot(activePad)]||{start:0,end:1},data=sample.getChannelData(0),stride=Math.max(1,Math.floor(data.length/w));x.fillStyle="#174c12";x.fillRect(0,0,w,h);x.strokeStyle="#d8ff4f";x.lineWidth=2;x.beginPath();for(let i=0;i<w;i++){let min=1,max=-1,from=i*stride,to=Math.min(data.length,from+stride);for(let j=from;j<to;j++){min=Math.min(min,data[j]);max=Math.max(max,data[j])}let y1=h*(.5-max*.46),y2=h*(.5-min*.46);x.moveTo(i,y1);x.lineTo(i,y2)}x.stroke();let now=ctx?ctx.currentTime:0;for(let q=playbackCursors.length-1;q>=0;q--){let c=playbackCursors[q],elapsed=(now-c.at)*c.rate;if(elapsed<0)continue;if(elapsed>c.duration){playbackCursors.splice(q,1);continue}if(c.pad===activePad){let pos=Math.max(0,Math.min(1,(c.offset+elapsed)/sample.duration));let px=pos*w;x.save();x.strokeStyle="#ffffff";x.shadowColor="#d8ff4f";x.shadowBlur=14;x.lineWidth=3;x.beginPath();x.moveTo(px,0);x.lineTo(px,h);x.stroke();x.fillStyle="#fff";x.font="bold 12px monospace";x.fillText("PLAY",Math.min(w-36,px+4),12);x.restore()}}x.fillStyle="#ff252555";x.fillRect(0,0,w*r.start,h);x.fillRect(w*r.end,0,w*(1-r.end),h);x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.moveTo(w*r.start,0);x.lineTo(w*r.start,h);x.moveTo(w*r.end,0);x.lineTo(w*r.end,h);x.stroke();x.fillStyle="#fff";x.font="bold 18px monospace";x.fillText("IN",Math.max(2,w*r.start+3),15);x.fillText("OUT",Math.min(w-38,w*r.end+3),15)}else{x.strokeStyle="#d8ff4f";x.lineWidth=2;if(analyser){let data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);x.beginPath();for(let i=0;i<w;i++){let yy=h/2+(data[Math.floor(i/w*data.length)]-128)/128*h*.42;i?x.lineTo(i,yy):x.moveTo(i,yy)}x.stroke()}else{x.beginPath();for(let i=0;i<w;i++){let yy=h/2+Math.sin(i*.05)*Math.sin(i*.013)*h*.2;i?x.lineTo(i,yy):x.moveTo(i,yy)}x.stroke()}}requestAnimationFrame(draw)}
canvas.addEventListener("pointerdown",e=>{if(activeTab!=="RECORTE"||!samples[sampleSlot(activePad)])return;canvas.setPointerCapture(e.pointerId);let rect=canvas.getBoundingClientRect(),p=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)),r=ranges[sampleSlot(activePad)]||{start:0,end:1};trimTarget=Math.abs(p-r.start)<=Math.abs(p-r.end)?"start":"end";setTrimValue(trimTarget,p);updateScreen()});canvas.addEventListener("pointermove",e=>{if(!e.buttons||activeTab!=="RECORTE"||!samples[sampleSlot(activePad)])return;let rect=canvas.getBoundingClientRect(),p=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));setTrimValue(trimTarget,p)});

window.addEventListener("message",async function(ev){
 if(ev.source!==parent||ev.origin!==location.origin||!ev.data||ev.data.type!=="zp-engine-command")return;
 const packet=ev.data,command=packet.command,payload=packet.payload||{},requestId=packet.requestId;
 const reply=(type,data)=>parent.postMessage({type:type,protocolVersion:1,source:"creator.engine",requestId,command,...data},location.origin);
 if(packet.protocolVersion!==1||packet.source!=="creator.ui"||typeof requestId!=="string"||requestId.length>120||typeof command!=="string"||!command.startsWith("creator.")){
  reply("zp-engine-error",{error:{code:"INVALID_MESSAGE",message:"Paquete de comando inválido",source:"creator.engine"}});return;
 }
 try{
  let result=null;
  if(command==="creator.sample.load.request"){file.click();result={ok:true,data:{status:"file-picker-opened"},requestId};}
  else if(command==="creator.pad.select"){setActivePad(Math.max(1,Math.min(9,Number(payload.padId)||1)));publishRadioState();result={ok:true,data:{padId:activePad},requestId};}
  else if(command==="creator.sample.trim.target.toggle"){trimTarget=trimTarget==="start"?"end":"start";valueTarget=trimTarget;updateScreen();updateValueReadout();result={ok:true,data:{target:trimTarget},requestId};}
  else if(command==="creator.sample.trim.set"){const target=payload.target==="end"?"end":"start";setTrimValue(target,Number(payload.position));valueTarget=target;trimTarget=target;updateValueReadout();if(payload.commit&&samples[sampleSlot(activePad)])await assetStorage.saveProjectSample(currentProjectId,activePad,samples[sampleSlot(activePad)],sampleNames[sampleSlot(activePad)],ranges[sampleSlot(activePad)],activeBank);result={ok:true,data:{target:target,range:ranges[sampleSlot(activePad)]||{start:0,end:1},persisted:!!payload.commit},requestId};}
  else if(command==="creator.control.set"){
   const v=Math.max(0,Math.min(1,Number(payload.value)||0));audio();
   if(payload.name==="master"){masterLevel=v;master.gain.setTargetAtTime(v,ctx.currentTime,.02)}
   else if(payload.name==="pad-volume"){padLevels[activePad]=v;publishValueFeedback("PAD VOL",Math.round(v*100)+"%")}
   else if(payload.name==="pad-pitch"){padPitch[activePad]=(v-.5)*48;publishValueFeedback("PITCH",Math.round(padPitch[activePad])+" ST")}
   else if(payload.name==="pad-filter"){padFilter[activePad]=300+v*17700;filterBus.frequency.setTargetAtTime(padFilter[activePad],ctx.currentTime,.02);publishValueFeedback("FILTER",Math.round(padFilter[activePad])+" HZ")}
   else if(payload.name==="cutoff"){padFilter[activePad]=300+v*17700;filterBus.frequency.setTargetAtTime(padFilter[activePad],ctx.currentTime,.02);publishValueFeedback("FILTER",Math.round(padFilter[activePad])+" HZ")}
   else if(payload.name==="resonance"){filterBus.Q.setTargetAtTime(.1+v*17.9,ctx.currentTime,.02);publishValueFeedback("RESONANCE",Math.round((.1+v*17.9)*10)/10)}
   else if(payload.name==="drive"){fxAmount=v;driveAmount(fxState.drive?v*35:0);publishValueFeedback("DRIVE",Math.round(v*100)+"%")}
   else if(["attack","decay","release"].includes(payload.name)){const e=envelopes[activePad]||(envelopes[activePad]={attack:.01,decay:.18,release:.2,sustain:.72}),limits={attack:[.001,2],decay:[.005,3],release:[.005,4]},range=limits[payload.name];e[payload.name]=range[0]+v*(range[1]-range[0]);publishValueFeedback(payload.name.toUpperCase(),e[payload.name].toFixed(3)+" S")}
   else if(payload.name==="fx-amount"){fxAmount=v;applyFxAmount();publishValueFeedback("FX",Math.round(v*100)+"%")}
   else throw Object.assign(new Error("Parámetro desconocido: "+payload.name),{code:"INVALID_INPUT"});
   if(payload.commit){await saveSession(true);publishRadioState()}
   result={ok:true,data:{name:payload.name,value:v,padId:activePad,persisted:!!payload.commit},requestId};
  }else{
   result=await runtime.execute(command,payload);
   if(!result||result.ok===false){reply("zp-engine-error",{result:result,error:result?.error||{code:"COMMAND_FAILED",message:"El comando no pudo ejecutarse",source:"creator.core"}});return;}
  }
  reply("zp-engine-ack",{result:result});
 }catch(error){reply("zp-engine-error",{error:{code:error.code||"ENGINE_ERROR",message:String(error&&error.message||error),source:"creator.engine"}});}
});
